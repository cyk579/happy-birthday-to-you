<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07080c" />
    <meta name="description" content="把星光藏进这一刻，愿新的一岁，开心常在。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="happy birthday to you" />
    <meta property="og:description" content="把星光藏进这一刻，愿新的一岁，开心常在。" />
    <meta property="og:url" content="https://cyk579.github.io/happy-birthday-to-you/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="happy birthday to you" />
    <meta name="twitter:description" content="把星光藏进这一刻，愿新的一岁，开心常在。" />
    <title>happy birthday to you</title>
    <link rel="preload" href="assets/serif-sc.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="assets/cormorant-italic.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="app" aria-label="互动生日礼物">
      <canvas id="scene" aria-hidden="true"></canvas>
      <div class="vignette" aria-hidden="true"></div>
      <section id="welcome" class="welcome" aria-labelledby="welcome-title">
        <header class="invitation-header">
          <div class="invitation-brand"><span class="glyph glyph--sparkles" aria-hidden="true"></span>星光来信</div>
        </header>
        <div class="welcome__content">
          <h1 id="welcome-title" lang="en">Happy Birthday</h1>
          <p class="welcome__script" lang="en">Cheers to another great year.</p>
          <p class="welcome__message">把星光藏进这一刻，<br />愿新的一岁，开心常在。</p>
          <button id="enter" class="primary-button" type="button">
            <span>开启生日礼物</span>
            <span class="primary-button__arrow" aria-hidden="true"><span class="glyph glyph--arrow"></span></span>
          </button>
        </div>
        <footer class="invitation-footer">
          <p>愿你尽兴做自己，遇见更多好风景。</p>
          <span class="invitation-footer__signature" lang="en">Stay curious, stay happy.</span>
        </footer>
      </section>

      <header id="scene-controls" class="topbar" aria-label="场景控制" inert>
        <div class="brand-mark"><span class="glyph glyph--sparkles" aria-hidden="true"></span> 星光来信</div>
        <div class="topbar__actions">
          <button id="sound-toggle" class="icon-button" type="button" aria-label="关闭声音" title="关闭声音" aria-pressed="true"><span class="glyph glyph--volume" aria-hidden="true"></span></button>
          <button id="mic-toggle" class="icon-button" type="button" aria-label="开启麦克风" title="开启麦克风" aria-pressed="false"><span class="glyph glyph--mic" aria-hidden="true"></span></button>
          <button id="camera-toggle" class="icon-button" type="button" aria-label="开启摄像头手势" title="开启摄像头手势" aria-pressed="false" aria-controls="gesture-panel"><span class="glyph glyph--camera" aria-hidden="true"></span></button>
        </div>
      </header>

      <aside id="gesture-panel" class="gesture-panel" aria-label="手势控制" hidden>
        <div class="gesture-panel__header">
          <span><i class="gesture-dot" aria-hidden="true"></i> 隔空转动</span>
          <button id="camera-close" class="gesture-close" type="button" aria-label="关闭摄像头手势" title="关闭摄像头手势">×</button>
        </div>
        <div class="gesture-panel__body">
          <div class="gesture-preview">
            <video id="hand-video" autoplay playsinline muted aria-hidden="true"></video>
            <canvas id="hand-overlay" width="320" height="240" aria-hidden="true"></canvas>
            <span class="gesture-preview__empty" aria-hidden="true">CAMERA</span>
          </div>
          <div class="gesture-help">
            <p id="gesture-status" role="status">把一只手放到镜头前</p>
            <p>张掌摆手 · 旋转与俯仰<br />比 V 停留 · 翻转<br />握拳停留 · 复位</p>
            <div class="gesture-progress" aria-hidden="true"><span id="gesture-progress"></span></div>
          </div>
        </div>
        <div class="gesture-panel__footer">
          <span>画面仅在此设备处理</span>
          <div><button id="gesture-flip" type="button">翻转</button><button id="gesture-reset" type="button">复位</button></div>
        </div>
      </aside>
      <div id="hand-cursor" class="hand-cursor" aria-hidden="true" hidden></div>

      <section id="scene-copy" class="scene-copy" aria-live="polite">
        <div class="scene-copy__line"></div>
        <p class="scene-copy__overline">MAKE A WISH</p>
        <p id="instruction" class="scene-copy__instruction">靠近一点，吹灭蜡烛</p>
      </section>

      <footer class="footer-note"><span id="mic-status">麦克风未开启</span><span class="footer-note__separator">·</span><span>TAKE YOUR TIME</span></footer>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
